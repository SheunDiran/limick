class: Comment
table: comment
fields:
  postId: int, relation(parent=post, onDelete=Cascade)
  profileId: int, relation(parent=reader, onDelete=Cascade)
  parentId: int?
  body: String
  ### Set when a book account replied (AI, grounded in the passage). The
  ### comment is stored under the official account.
  asBookId: int?
  likeCount: int, default=0
  replyCount: int, default=0
  deleted: bool, default=false
  createdAt: DateTime, default=now
indexes:
  comment_post_idx:
    fields: postId
