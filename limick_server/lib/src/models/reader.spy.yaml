### Limick's own data for a signed-in user.
class: Reader
table: reader
fields:
  authUserId: UuidValue?, scope=serverOnly
  handle: String
  displayName: String
  bio: String, default=''
  field: String?
  interests: List<Topic>
  dailyGoalMinutes: int, default=15
  onboarded: bool, default=false
  avatarHue: int, default=210
  streakDays: int, default=0
  lastActiveDay: String?
  tzOffsetMinutes: int, default=0
  createdAt: DateTime, default=now
indexes:
  reader_auth_idx:
    fields: authUserId
    unique: true
  reader_handle_idx:
    fields: handle
    unique: true
