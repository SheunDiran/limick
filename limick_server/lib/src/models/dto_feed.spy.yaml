### One card in a feed: a post with the viewer's state, or a word review.
class: FeedItem
fields:
  kind: FeedItemKind
  post: Post?
  book: Book?
  chapterTitle: String?
  liked: bool, default=false
  saved: bool, default=false
  followingBook: bool, default=false
  quizChoice: int?
  quizCorrectIndex: int?
  quizExplanation: String?
  ### Real answer counts per option, revealed after the reader answers.
  quizCounts: List<int>?
  debateVote: bool?
  reason: String?
  review: SavedWord?
  official: OfficialPost?
